<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>框选二维码 — 2FA Helper</title>
  <link rel="stylesheet" href="selector.css" />
</head>
<body>
  <header class="bar">
    <div class="title">框选二维码</div>
    <div class="hint" id="hint">在当前网页的截图上拖动，框住二维码即可自动识别</div>
    <div class="actions">
      <button class="btn ghost" id="wholeBtn">整张图识别</button>
      <button class="btn" id="cancelBtn">关闭</button>
    </div>
  </header>

  <div class="result" id="result" hidden></div>
  <div class="err" id="err" hidden></div>

  <main class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <img id="shot" alt="当前网页截图" draggable="false" />
      <div class="sel" id="sel" hidden></div>
    </div>
  </main>

  <footer class="foot">
    <span class="muted" id="status">准备中…</span>
    <span class="muted">提示：框得越紧识别越快；识别成功后本窗口会自动关闭。</span>
  </footer>

  <script src="../vendor/jsqr.js"></script>
  <script src="../lib/util.js"></script>
  <script src="../lib/qr.js"></script>
  <script src="selector.js"></script>
</body>
</html>
